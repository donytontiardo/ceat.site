{% extends "base.html" %}
{% block content %}
<main>
	<div class="container">
		<h2>Section {{ section.label }}</h2>
		<ul>
			<li>Jumlah Pertanyaan: {{ count }}</li>
			<li>Jenis Pertanyaan: {{ info.type_questions }}</li>
			<li>Waktu: {{ minutes }} menit</li>
			<li>Petunjuk Pengerjaan:</li>
		</ul>
		{% include "instructions/" ~ section.name ~ ".html" %}
		<p class="continue">
			<a href="{{ url_for('main.question', section=section.name, number=1) }}" class="start primary pill">Lanjutkan</a>
		</p>
	</div>
</main>
{% endblock %}
