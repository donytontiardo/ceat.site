{% extends "base.html" %}
{% block content %}
<main>
	<div class="container">
		<table>
			<tr>
				<th>No</th>
				<th>Waktu</th>
				<th>Tanggal</th>
				<th>Aksi</th>
			</tr>
			{% for result in results %}
				<tr>
					<td>{{ loop.index }}</td>
					<td>{{ result.waktu }}</td>
					<td>{{ result.tanggal }}</td>
					<td class="cell-center">
						<a href="{{ url_for('main.result', result_id=result.id_result) }}" class="start primary pill">Lihat</a>
					</td>
				</tr>
			{% endfor %}
		</table>
	</div>
	<div class="actions">
		<a href="{{ url_for('main.index') }}" class="start pill">Kembali</a>
	</div>
</main>
{% endblock %}
