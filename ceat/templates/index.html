{% extends "base.html" %}
{% block content %}
<main>
	<div class="container hero">
		<img src="{{ url_for('static', filename='images/logowhite.png') }}" alt="CEAT">
		<div class="actions-row">
			{% if user %}
				<a href="{{ url_for('main.test') }}" class="start pill">Take The Test</a>
				<a href="{{ url_for('main.results') }}" class="start pill">See Your Result</a>
			{% else %}
				<a href="{{ url_for('main.login') }}" class="start pill">Take The Test</a>
			{% endif %}
		</div>
	</div>
</main>
{% endblock %}
