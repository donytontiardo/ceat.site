{% extends "assessment/base.html" %}{% load static %}
{% block content %}
<main class="auth-page">
	<div class="container split">
		<div class="split-logo"><img src="{% static 'images/logo.png' %}" alt="CEAT"></div>
		<div class="auth-card">
			<form action="{% url 'login' %}" method="post">
				{% csrf_token %}
				<h1>Masuk</h1>
				<label for="nim">NIM</label>
				<input id="nim" type="text" inputmode="numeric" pattern="[0-9]{1,20}" name="nim" required autocomplete="username">
				<br><br>
				<label for="password">Kata Sandi</label>
				<input id="password" type="password" name="password" required autocomplete="current-password">
				<br><br>
				<button type="submit" class="start primary wide">Masuk</button>
				<div class="switch">Belum punya akun? <a href="{% url 'register' %}">Daftar</a></div>
			</form>
		</div>
	</div>
</main>
{% endblock %}
