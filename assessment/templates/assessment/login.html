{% extends "assessment/base.html" %}
{% block title %}Sign in · CEAT{% endblock %}
{% block content %}
<section class="page page-xs">
	<header class="page-head">
		<h1>Sign in</h1>
		<p class="lead">Use your student ID and password.</p>
	</header>
	<form action="{% url 'login' %}" method="post" class="form">
		{% csrf_token %}
		<div class="field">
			<label for="nim">Student ID</label>
			<input id="nim" type="text" inputmode="numeric" pattern="[0-9]{1,20}" name="nim" required autocomplete="username" autofocus>
		</div>
		<div class="field">
			<label for="password">Password</label>
			<input id="password" type="password" name="password" required autocomplete="current-password">
		</div>
		<button type="submit" class="btn btn-lg btn-block">Sign in</button>
	</form>
	<p class="switch">New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
