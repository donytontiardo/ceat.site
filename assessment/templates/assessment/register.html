{% extends "assessment/base.html" %}{% load static %}
{% block content %}
<main class="auth-page">
	<div class="container split">
		<div class="split-logo"><img src="{% static 'images/logo.png' %}" alt="CEAT"></div>
		<div class="auth-card">
			<form action="{% url 'register' %}" method="post">
				{% csrf_token %}
				<h1>Buat Akun</h1>
				<label for="name">Nama Lengkap</label>
				<input id="name" type="text" name="name" required maxlength="100" autocomplete="name">
				<br><br>
				<label for="nim">NIM</label>
				<input id="nim" type="text" inputmode="numeric" pattern="[0-9]{1,20}" name="nim" required autocomplete="username">
				<br><br>
				<label for="age">Usia</label>
				<input id="age" type="number" name="age" min="{{ min_age }}" max="{{ max_age }}" required>
				<br><br>
				<label for="password">Kata Sandi (minimal 8 karakter, bukan hanya angka)</label>
				<input id="password" type="password" name="password" required minlength="8"
				       maxlength="{{ max_password }}" autocomplete="new-password">
				<br><br>
				<button type="submit" class="start primary wide">Daftar</button>
				<div class="switch">Sudah punya akun? <a href="{% url 'login' %}">Masuk</a></div>
			</form>
		</div>
	</div>
</main>
{% endblock %}
