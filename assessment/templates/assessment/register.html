{% extends "assessment/base.html" %}
{% block title %}Sign up · CEAT{% endblock %}
{% block content %}
<section class="page page-xs">
	<header class="page-head">
		<h1>Create an account</h1>
		<p class="lead">One account to take the test and keep your results.</p>
	</header>
	<form action="{% url 'register' %}" method="post" class="form">
		{% csrf_token %}
		<div class="field">
			<label for="name">Full name</label>
			<input id="name" type="text" name="name" required maxlength="100" autocomplete="name" autofocus>
		</div>
		<div class="field-row">
			<div class="field">
				<label for="nim">Student ID</label>
				<input id="nim" type="text" inputmode="numeric" pattern="[0-9]{1,20}" name="nim" required autocomplete="username">
			</div>
			<div class="field field-age">
				<label for="age">Age</label>
				<input id="age" type="number" name="age" min="{{ min_age }}" max="{{ max_age }}" required>
			</div>
		</div>
		<div class="field">
			<label for="password">Password</label>
			<input id="password" type="password" name="password" required minlength="8"
			       maxlength="{{ max_password }}" autocomplete="new-password" aria-describedby="password-hint">
			<span class="hint" id="password-hint">At least 8 characters, not only digits.</span>
		</div>
		<button type="submit" class="btn btn-lg btn-block">Create account</button>
	</form>
	<p class="switch">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</section>
{% endblock %}
