[project]
name = "ceat"
version = "2.0.0"
description = "Aptitude assessment website: a Mamdani fuzzy model maps test results to computer careers"
authors = [{ name = "Dony Tontiardo", email = "tontiardon@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "bcrypt>=4.0",       # to read the bcrypt passwords of a database imported from the PHP site
]

[project.optional-dependencies]
mysql = ["pymysql>=1.0"]                  # flask import-mysql
server = ["gunicorn>=21"]
test = ["pytest>=8", "pymysql>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ceat"]
include-package-data = true

[tool.setuptools.package-data]
ceat = ["schema.sql", "templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
